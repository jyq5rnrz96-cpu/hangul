<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangul aktualisieren</title><style>body{font:18px system-ui;background:#09131d;color:#e8eff5;margin:0;padding:28px}main{max-width:520px;margin:12vh auto;background:#142331;border-radius:24px;padding:26px}p{line-height:1.6}button{font:inherit;padding:14px;border:0;border-radius:12px;background:#b9ee75;color:#102b40;cursor:pointer}</style></head><body><main><h1>Hangul aktualisieren</h1><p id="status" role="status">Die aktuelle App wird frisch geladen. Deine Vokabeln und Lernstände bleiben erhalten.</p><button id="retry" hidden>Erneut versuchen</button></main><script>
async function updateApp(){
const status=document.querySelector('#status'),retry=document.querySelector('#retry');retry.hidden=true;
try{
 if(!('serviceWorker'in navigator))throw Error('Bitte diese Seite in Safari oder einem unterstützten Browser öffnen.');
 const check=new URL('./app.js',location.href);check.searchParams.set('__hangul_fresh',Date.now());const response=await fetch(check,{cache:'no-store'});if(!response.ok||!(await response.text()).includes('HANGUL_FARM_APP_V26'))throw Error('v26 ist hier noch nicht vollständig veröffentlicht. Bitte die GitHub-Bereitstellung abwarten und erneut versuchen.');
 status.textContent='Die App-Dateien werden erneuert. Bitte diese Seite geöffnet lassen …';
 const worker=new URL('./sw.js',location.href);worker.searchParams.set('release','v26-harvest1');
 const registration=await navigator.serviceWorker.register(worker.href,{scope:new URL('./',location.href).href,updateViaCache:'none'});
 await registration.update();const candidate=registration.installing||registration.waiting||registration.active;if(!candidate||candidate.scriptURL!==worker.href)throw Error('Die neuen Dateien sind noch nicht vollständig bereitgestellt. Bitte erneut versuchen.');
 await new Promise((resolve,reject)=>{let timer;const inspect=()=>{if(candidate.state==='activated'){clearTimeout(timer);resolve();}else if(candidate.state==='redundant'){clearTimeout(timer);reject(Error('Eine App-Datei fehlt oder wurde noch nicht vollständig bereitgestellt. Bitte erneut versuchen.'));}};candidate.addEventListener('statechange',inspect);timer=setTimeout(()=>reject(Error('Aktualisierung dauert zu lange. Prüfe deine Internetverbindung und versuche es erneut.')),45000);inspect();});
 status.textContent='Aktualisiert auf v26. Die App wird geöffnet …';const target=new URL('./',location.href);target.searchParams.set('updated','v26-harvest1');location.replace(target.href);
}catch(error){status.textContent=error.message;retry.hidden=false;}
}
document.querySelector('#retry').onclick=updateApp;updateApp();
</script></body></html>
