<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangul aktualisieren</title><style>body{font:18px system-ui;background:#09131d;color:#e8eff5;margin:0;padding:30px}main{max-width:520px;margin:15vh auto;background:#142331;border-radius:24px;padding:28px}p{line-height:1.6}a{color:#94cfff}</style></head><body><main><h1>Hangul · Dark Mode</h1><p id="status" role="status">Die App-Dateien werden aktualisiert. Deine gespeicherten Vokabeln bleiben erhalten.</p><a id="retry" hidden href="">Erneut versuchen</a></main><script>
(async()=>{try{const source=await fetch('./app.js?check='+Date.now(),{cache:'no-store'});if(!source.ok||!(await source.text()).includes('HANGUL_EMOJI_V7'))throw Error('Hier läuft noch ein alter Projektordner. Schließe das bisherige Vorschaufenster und starte Hangul-starten.cmd aus dem neu entpackten Projektordner.');if('serviceWorker'in navigator){const scope=new URL('./',location.href).href;const registrations=await navigator.serviceWorker.getRegistrations();for(const r of registrations)if(r.scope===scope)await r.unregister();}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('hangul-')).map(k=>caches.delete(k)));}document.querySelector('#status').textContent='Aktualisiert. Die neue Version mit Emojis wird geöffnet …';location.replace('./?english-update='+Date.now());}catch(error){document.querySelector('#status').textContent=error.message;document.querySelector('#retry').hidden=false;}})();
</script></body></html>
