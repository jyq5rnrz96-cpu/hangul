<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangul aktualisieren</title><style>body{font:18px system-ui;background:#f3f6f8;color:#102b40;margin:0;padding:30px}main{max-width:520px;margin:15vh auto;background:white;border-radius:24px;padding:28px}p{line-height:1.6}a{color:#245e83}</style></head><body><main><h1>Koreanisch ↔ Englisch / Deutsch</h1><p id="status" role="status">Die App-Dateien werden aktualisiert. Deine gespeicherten Vokabeln bleiben erhalten.</p><a id="retry" hidden href="">Erneut versuchen</a></main><script>
(async()=>{try{const source=await fetch('./app.js?check='+Date.now(),{cache:'no-store'});if(!source.ok||!(await source.text()).includes('translationAnswers(current)'))throw Error('Hier läuft noch ein alter Projektordner. Schließe das bisherige Vorschaufenster und starte Hangul-starten.cmd aus dem neu entpackten neuen Projektordner.');if('serviceWorker'in navigator){const scope=new URL('./',location.href).href;const registrations=await navigator.serviceWorker.getRegistrations();for(const r of registrations)if(r.scope===scope)await r.unregister();}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('hangul-')).map(k=>caches.delete(k)));}document.querySelector('#status').textContent='Aktualisiert. Die zweisprachige Version wird geöffnet …';location.replace('./?english-update='+Date.now());}catch(error){document.querySelector('#status').textContent=error.message;document.querySelector('#retry').hidden=false;}})();
</script></body></html>
