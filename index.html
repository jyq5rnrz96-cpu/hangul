<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hangul"><meta name="description" content="Dein persönlicher Koreanisch-Trainer mit englischen und deutschen Bedeutungen. Lokal und offline."><title>Hangul · Dein Vokabeltrainer</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><a class="brand" href="#">한 <span>hangul<small>DEIN KOREANISCH. JEDEN TAG.</small></span></a><span id="offline" class="badge">Offline wird vorbereitet</span></header><main id="main"></main><nav aria-label="Hauptnavigation"><button data-view="learn">◉<span>Lernen</span></button><button data-view="words">▤<span>Vokabeln</span></button><button data-view="stats">▥<span>Fortschritt</span></button><button data-view="backup">⇅<span>Backup</span></button></nav><dialog id="editor"><form id="wordform"><div class="row"><h2 id="editTitle">Neue Vokabel</h2><button type="button" id="close" class="quiet" aria-label="Schließen">✕</button></div><input type="hidden" name="id"><label>Koreanisch<input name="ko" required maxlength="300" placeholder="안녕하세요" lang="ko"></label><label>Englisch<input name="en" maxlength="300" placeholder="Hello; Hi" lang="en"></label><label>Deutsch<input name="de" maxlength="300" placeholder="Hallo; Guten Tag" lang="de"></label><p class="hint">Englisch, Deutsch oder beides eintragen. Beide Sprachen zählen bei der Abfrage als richtig. Mehrere Bedeutungen mit Semikolon trennen.</p><label>Umschrift (optional)<input name="roman" maxlength="300" placeholder="annyeonghaseyo"></label><label>Beispielsatz (optional)<textarea name="example" maxlength="1000"></textarea></label><label>Kategorie<input name="category" maxlength="100" list="categories" placeholder="Alltag"></label><datalist id="categories"></datalist><button class="primary" type="submit">Vokabel speichern</button></form></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
